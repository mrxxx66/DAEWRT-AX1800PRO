name: Cache-Clean

on:
  schedule:
     #每周一4:00
    - cron: '30 5 * * 1,3'
    #每天4:00
    #- cron: 0 4 * * *
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: gh cache delete --all
